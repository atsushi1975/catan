<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カタン（プレイヤー）</title>
<link rel="stylesheet" href="style.css">
<style>
  #lobby { max-width: 560px; margin: 24px auto; padding: 16px; color: #eee; }
  #lobby h1 { font-size: 20px; margin: 0 0 12px; }
  #lobby .row { display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    border: 1px solid #333; border-radius: 6px; margin: 4px 0; background: #202020; }
  #lobby .row.me { border-color: #4caf50; }
  #lobby .row .seat { color: #888; width: 2.5em; }
  #lobby .row .name { flex: 1; }
  #lobby .row .roll { font-variant-numeric: tabular-nums; color: #ffd54f; }
  #lobby input[type=text] { padding: 6px; border-radius: 6px; border: 1px solid #555;
    background: #1a1a1a; color: #eee; }
  #lobby .muted { color: #999; font-size: 12px; }
  #lobby .order { margin-top: 10px; font-size: 13px; }
  #lobby .slot { min-width: 68px; padding: 6px 4px; font-size: 12px; line-height: 1.5;
    border: 1px solid #555; border-radius: 6px; background: #202020; color: #eee;
    cursor: pointer; text-align: center; font-family: inherit; }
  #lobby .slot.taken { border-color: #4caf50; }
  #lobby .slot.mine { background: #1b3a1b; box-shadow: 0 0 0 1px #4caf50; }
  #lobby .slot:not([disabled]):hover { border-color: #ffd54f; }
  #lobby .slot[disabled] { opacity: .75; cursor: default; }
  #lobby .rules { margin-top: 10px; padding: 10px 12px; border: 1px solid #333;
    border-radius: 8px; background: #1c1c1c; }
  #lobby .rules-title { font-size: 13px; font-weight: bold; color: #ffd54f;
    margin-bottom: 6px; }
  #lobby .rules-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #lobby .rules-label { font-size: 13px; color: #bbb; }
  #lobby .rules-choices { display: flex; gap: 12px; flex-wrap: wrap; }
  #lobby .radio { font-size: 13px; white-space: nowrap; display: inline-flex; align-items: center;
    gap: 4px; cursor: pointer; }
  #lobby .radio input { accent-color: #4caf50; }
  #lobby .radio.fixed { background: linear-gradient(90deg, #3a1f1f 0%, #2b1818 100%); border: 1px solid #ff6b6b; border-radius: 4px; padding: 2px 6px; color: #ffb8b8; font-weight: bold; }
  #lobby .radio.fixed input { opacity: 0.7; }
  #lobby .rules-note { margin-top: 6px; font-size: 11px; color: #888; }
  /* piece colour picker */
  #lobby .cs { display: inline-block; width: 12px; height: 12px; border-radius: 3px;
    border: 1px solid #888; margin-right: 6px; vertical-align: -1px; }
  #lobby .color-btn { display: inline-flex; align-items: center; gap: 2px; padding: 5px 9px;
    border-radius: 6px; border: 1px solid #555; background: #202020; color: #eee;
    font-size: 12px; font-family: inherit; cursor: pointer; }
  #lobby .color-btn.on { border-color: #4caf50; box-shadow: 0 0 0 1px #4caf50; }
  #lobby .color-btn:disabled { opacity: .45; cursor: not-allowed; }
  /* Lobby board preview: the map is drawn above the lobby panel so the turn
     order can be chosen while looking at the board that will be played. */
  body.preview { display: flex; flex-direction: column; min-height: 100vh;
    /* The lobby is taller than the screen on phones, so the page MUST scroll
       here - otherwise the lower (lobby) half is unreachable. The game view
       keeps body overflow:hidden, only the preview scrolls. */
    overflow-y: auto; -webkit-overflow-scrolling: touch; }
  body.preview #layout { order: 1; display: flex; flex-direction: column;
    height: auto; width: 100%; }
  body.preview #sidebar { display: none; }
  body.preview #board-wrap { flex: none; width: min(100%, calc(58vh * 1.06));
    aspect-ratio: 10.6 / 10; margin: 0 auto; }
  body.preview #lobby { order: 2; max-width: 640px; width: 100%;
    margin: 8px auto 24px; box-sizing: border-box; }
  @media (max-width: 860px) {
    /* style.css hides overflow on phones; in the lobby we want a scrollable
       page instead (board on top, lobby below). */
    body.preview { overflow-y: auto; height: auto; }
    body.preview #layout { height: auto; }
    body.preview #board-wrap { width: min(100%, 86vw); }
  }
  #game { display: none; }
  #link-monitor { position: fixed; right: 8px; bottom: 8px; font-size: 11px; color: #78909c; z-index: 10; }
</style>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a9fd0">
</head>
<body>
<div id="lobby">
  <h1>カタン ロビー</h1>
  <div id="lobby-body">読み込み中...</div>
</div>

<div id="layout" style="display:none;">
  <div id="board-wrap"><canvas id="board"></canvas></div>
  <div id="sidebar"></div>
</div>

<a id="link-monitor" href="/monitor" target="_blank">監視画面</a>

<script src="game.js"></script>
<script>
(function () {
  // ---- token storage -------------------------------------------------------
  // Phones discard backgrounded tabs after a long idle. When that happens the
  // per-tab id kept in sessionStorage can be cleared too, and looking the token
  // up by tab id then failed: the player came back as a spectator and could
  // never act again.
  //
  // Tokens still live in localStorage keyed by tab id (two tabs on one PC stay
  // two different players), but we ALSO remember the last seat this browser
  // used. If the tab id is gone after a wake-up, the client re-claims that seat
  // - only while a game is running, only if the server still knows the token,
  // and only if no other live tab is holding it (heartbeat below), so opening a
  // second tab never steals player 1's seat.
  const TABKEY = 'catan_tabid';
  const TKEY = 'catan_tokens';     // { tabId: token }
  const LKEY = 'catan_last_seat';  // { token, tabId, at }
  const BKEY = 'catan_tab_beats';  // { tabId: lastSeenMs }

  function readMap(key) {
    try { return JSON.parse(localStorage.getItem(key) || '{}') || {}; }
    catch (e) { return {}; }
  }
  function writeMap(key, m) {
    try { localStorage.setItem(key, JSON.stringify(m)); } catch (e) {}
  }
  function tabId() {
    let t = null;
    try { t = sessionStorage.getItem(TABKEY); } catch (e) {}
    if (!t) {
      t = 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      try { sessionStorage.setItem(TABKEY, t); } catch (e) {}
    }
    return t;
  }
  // A tab counts as alive if it beat recently. Background tabs throttle timers
  // to about once a minute, so the window has to be generous.
  const TAB_ALIVE_MS = 90000;
  function beat() {
    const b = readMap(BKEY);
    const now = Date.now();
    b[tabId()] = now;
    for (const k of Object.keys(b)) if (now - b[k] > 600000) delete b[k];
    writeMap(BKEY, b);
    try { diagLine(); } catch (e) {}   // keep the status line current everywhere
  }
  function tabAlive(id) {
    const b = readMap(BKEY);
    return !!(id && b[id] && Date.now() - b[id] < TAB_ALIVE_MS);
  }
  // A tab that is closed a second ago still has a fresh heartbeat, so a beat
  // alone cannot tell "closed" from "open". Ask the other tabs directly: a tab
  // that is really open answers the ping, a closed one cannot.
  let bc = null;
  const pongs = new Set();
  try { bc = new BroadcastChannel('catan_tabs'); } catch (e) { bc = null; }
  if (bc) {
    bc.onmessage = ev => {
      const d = ev.data || {};
      if (d.t === 'ping') { try { bc.postMessage({ t: 'pong', id: tabId() }); } catch (e) {} }
      else if (d.t === 'pong' && d.id && d.id !== tabId()) pongs.add(d.id);
    };
  }
  // true: another tab answered, false: nobody did (we are alone), null: cannot tell
  function anyLiveTab() {
    if (!bc) return Promise.resolve(null);
    pongs.clear();
    try { bc.postMessage({ t: 'ping' }); } catch (e) { return Promise.resolve(null); }
    return new Promise(res => setTimeout(() => res(pongs.size > 0), 600));
  }
  // A closed tab should not look alive: drop our beat when the page goes away.
  window.addEventListener('pagehide', () => {
    try {
      const b = readMap(BKEY);
      delete b[tabId()];
      writeMap(BKEY, b);
    } catch (e) {}
  });
  function readTokens() { return readMap(TKEY); }
  function getToken() {
    const m = readTokens();
    return m[tabId()] || null;
  }
  function lastSeat() { return readMap(LKEY); }
  function setToken(t) {
    const m = readTokens();
    const id = tabId();
    if (t) {
      m[id] = t;
      writeMap(LKEY, { token: t, tabId: id, at: Date.now() });
    } else {
      // Only the tab's own entry goes away. The "last seat" memory is kept on
      // purpose: a bad poll must never make the seat unrecoverable.
      delete m[id];
    }
    writeMap(TKEY, m);
  }
  function forgetSeat() { writeMap(LKEY, {}); }
  // Every stored token is a candidate (the "last seat" one first). Tokens owned
  // by a tab that is still alive are excluded so a second tab cannot steal a
  // player's seat. When we know for sure that no other tab is open
  // (`alone === true`), the heartbeat check is skipped - a tab that was closed
  // a moment ago still has a fresh beat and must not block the recovery.
  function candidateTokens(alone) {
    const out = [];
    const live = k => !alone && tabAlive(k);
    const last = lastSeat();
    const id = tabId();
    if (last && last.token) out.push(last.token);
    const m = readTokens();
    for (const k of Object.keys(m)) {
      if (!m[k]) continue;
      if (k !== id && live(k)) continue;    // a live tab owns this one
      out.push(m[k]);
    }
    if (last && last.token && last.tabId !== id && live(last.tabId)) {
      const i = out.indexOf(last.token);
      if (i >= 0) out.splice(i, 1);
    }
    return out.filter((t, i, a) => a.indexOf(t) === i);
  }
  // The tab id did not survive the wake-up: re-claim a seat this browser used,
  // but only if the server still knows that seat.
  async function recoverSeat() {
    const others = await anyLiveTab();
    for (const tok of candidateTokens(others === false)) {
      let r = null;
      try {
        r = await fetch('/room?token=' + encodeURIComponent(tok)).then(x => x.json());
      } catch (e) { return false; }
      if (!r || !r.seats) return false;
      if (r.you_seat === null || r.you_seat === undefined) continue;
      token = tok;
      setToken(tok);
      // Drop other keys holding the same seat: they belong to tab ids that no
      // longer exist.
      const m = readTokens();
      let cleaned = false;
      for (const k of Object.keys(m)) {
        if (k !== tabId() && m[k] === tok) { delete m[k]; cleaned = true; }
      }
      if (cleaned) writeMap(TKEY, m);
      return true;
    }
    return false;
  }

  let token = getToken();
  let booted = false;
  let lastRecoverTry = 0;
  let lastRoom = null;      // last successful /room answer, for diagLine()
  const VERSION = 'v58';   // shown by diagLine(); bump whenever the client changes
  // Debug/diagnostic text stays hidden for players. Add ?diag=1 to the URL
  // (player or monitor page) when the build string or seat state is needed.
  const SHOW_DIAG = (() => {
    try { return new URLSearchParams(location.search).has('diag'); } catch (e) { return false; }
  })();
  // Android chrome often shows/hides the URL bar and the viewport height
  // reported by 100vh/100dvh does not match what is actually visible, which
  // pushed the bottom action sheet off-screen. Keep a CSS variable in sync so
  // the layout can clamp to the real visible height.
  function syncViewportH() {
    try {
      const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
      document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
    } catch (e) {}
  }
  syncViewportH();
  if (window.visualViewport) {
    try { window.visualViewport.addEventListener('resize', syncViewportH); } catch (e) {}
  }
  window.addEventListener('resize', syncViewportH);
  window.addEventListener('orientationchange', () => setTimeout(syncViewportH, 50));

  beat();
  setInterval(beat, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) beat(); });

  // -----------------------------------------------------------------------
  // Never fail silently. Any unexpected error used to leave the page showing
  // the board preview with no explanation at all.
  // -----------------------------------------------------------------------
  function showFatal(e) {
    const msg = String((e && (e.stack || e.message)) || e);
    let bar = document.getElementById('fatal-bar');
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'fatal-bar';
      bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99;padding:8px 10px;' +
        'background:#4a1a1a;color:#ffd9d9;font-size:11px;white-space:pre-wrap;max-height:35vh;overflow:auto';
      document.body.appendChild(bar);
    }
    bar.textContent = 'エラー: ' + msg;
    try { console.error(e); } catch (_) {}
  }
  window.addEventListener('error', ev => showFatal(ev.error || ev.message));
  window.addEventListener('unhandledrejection', ev => showFatal(ev.reason));

  // A tiny always-on status line. It tells us which build the phone is really
  // running and what the browser still remembers - without it, "it does not
  // work" cannot be told apart from "the old files are still being served".
  function diagLine() {
    if (!SHOW_DIAG) {
      const old = document.getElementById('diag-line');
      if (old) old.remove();
      return;
    }
    let d = document.getElementById('diag-line');
    if (!d) {
      d = document.createElement('div');
      d.id = 'diag-line';
      d.style.cssText = 'position:fixed;left:4px;bottom:2px;z-index:70;font-size:10px;' +
        'color:#999;pointer-events:none;text-shadow:0 0 2px #000';
      document.body.appendChild(d);
    }
    let tab = '?';
    try { tab = sessionStorage.getItem(TABKEY) ? 'y' : 'n'; } catch (e) {}
    let n = 0;
    try { n = Object.keys(readTokens()).length; } catch (e) {}
    let seat = 'n';
    try { seat = lastSeat().token ? 'y' : 'n'; } catch (e) {}
    let side = '?';
    try {
      const sb = document.getElementById('sidebar');
      side = sb ? (getComputedStyle(sb).display || '?') : 'none*';
    } catch (e) {}
    d.textContent = VERSION + ' | token:' + (token ? 'y' : 'n') +
      ' | saved:' + n + ' | seat:' + seat + ' | tab:' + tab +
      ' | ph:' + (lastRoom ? lastRoom.phase : '-') +
      ' | ys:' + (lastRoom && lastRoom.you_seat !== null && lastRoom.you_seat !== undefined ? lastRoom.you_seat : '-') +
      ' | boot:' + (booted ? 1 : 0) +
      ' | w:' + window.innerWidth +
      ' | side:' + side +
      ' | cls:' + (document.body.className || '-');
  }

  function q(path) {
    return token ? path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token) : path;
  }
  async function room() {
    return fetch(q('/room')).then(r => r.json());
  }
  async function act(action, extra) {
    const body = Object.assign({action}, extra || {});
    if (token) body.token = token;
    return fetch('/action', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)}).then(r => r.json());
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // Browser tab title: カタン（プレイヤー：<名前>） once the player has joined.
  function setTitle(name) {
    document.title = name ? ('カタン（プレイヤー：' + name + '）') : 'カタン（プレイヤー）';
  }

  // piece colours (names come from the server, so every tab agrees)
  const COLOR_HEX = { red: '#e53935', blue: '#1e88e5', white: '#ffffff', orange: '#fb8c00' };
  const COLOR_JA  = { red: '赤', blue: '青', white: '白', orange: 'オレンジ' };
  const COLOR_ORDER = ['red', 'blue', 'white', 'orange'];
  const colorOf = s => (s && COLOR_HEX[s.color]) ? s.color : 'red';

  let lastKey = null;

  // Show the map being drafted on (server sends it while the room is in the
  // lobby). The board is read-only in the lobby: no buildings, no clicks.
  function showPreview(board) {
    const layout = document.getElementById('layout');
    if (board) {
      document.body.classList.add('preview');
      layout.style.display = 'flex';
      CatanGame.previewBoard(board);
    } else {
      document.body.classList.remove('preview');
      layout.style.display = 'none';
      CatanGame.previewBoard(null);
    }
  }

  // A game is already running but this browser has no seat in it (the phone
  // dropped our token while the tab was discarded, or we are a new visitor).
  // The server does not allow joining mid-game, so show the lobby with a clear
  // explanation instead of an unusable board.
  function renderPlayingNotice(r) {
    const body = document.getElementById('lobby-body');
    const seats = (r.seats || []).map(s => esc(s.name)).join('、');
    // Diagnostics: enough to tell WHY the seat could not be taken back, without
    // ever printing the token itself.
    const seen = candidateTokens().length;
    const diag = `診断: トークン=${token ? 'あり' : 'なし'} / 復帰候補=${seen} / ` +
                 `応答 you_seat=${r.you_seat === null || r.you_seat === undefined ? 'null' : r.you_seat} / ` +
                 `参加者=${(r.seats || []).length}`;
    body.innerHTML = `<div class="muted">ゲーム進行中です（参加者: ${seats || '—'}）</div>
      <div class="order" style="color:#ffd54f;margin-top:8px;">
        このブラウザはこのゲームの席を持っていません。<br>
        放置などで接続が切れた場合、進行中のゲームには途中参加できません。<br>
        続けるには、だれかが監視画面から「ゲームを初期化」してロビーに戻してください。
      </div>
      <div style="margin-top:12px;">
        <button class="btn" id="btn-reload">再読み込み</button>
        <button class="btn" id="btn-retry">復帰を再試行</button>
        <a class="btn" href="/monitor" target="_blank" style="text-decoration:none;">監視画面を開く</a>
      </div>
      ${SHOW_DIAG ? `<div class="muted" style="font-size:11px;margin-top:10px;">${esc(diag)}</div>` : ''}`;
    body.dataset.built = '1';
    lastKey = null;
    const b = document.getElementById('btn-reload');
    if (b) b.onclick = () => location.reload();
    const t = document.getElementById('btn-retry');
    if (t) t.onclick = async () => {
      t.disabled = true;
      const ok = await recoverSeat();
      if (ok) location.reload();
      else { alert('復帰できませんでした。\n' + diag); t.disabled = false; }
    };
  }

  async function renderLobby() {
    let r = await room();
    // A failed poll (network hiccup right after a wake-up) must not be read as
    // "your seat is gone" - just wait for the next tick.
    if (!r || r.error || !r.seats) return;
    // Wake-up recovery: the tab id may be gone after the phone discarded the
    // tab, so try to re-claim this browser's last seat before showing the lobby.
    if (!token && (Date.now() - lastRecoverTry > 5000)) {
      lastRecoverTry = Date.now();
      if (await recoverSeat()) {
        const rr = await room();
        if (rr && rr.seats) r = rr;
      }
    }
    // A game is running. Only a player whose token still maps to a seat may
    // enter the board; anyone else (lost token after the phone discarded the
    // tab, or a fresh visitor) stays in the lobby. Joining mid-game is not
    // allowed by the server, so there is nothing useful to show them anyway.
    lastRoom = r;
    if (r.phase === 'playing') {
      const hasSeat = token && r.you_seat !== null && r.you_seat !== undefined;
      if (hasSeat) { showGame(r); return; }
      // The token no longer maps to a seat: forget it so a later reload shows
      // the plain join form (and the notice below is not shown forever).
      if (token) { setToken(null); token = null; }
      renderPlayingNotice(r);
      return;
    }

    const body = document.getElementById('lobby-body');
    const key = JSON.stringify(r);
    const mySeat = (r.you_seat !== null && r.you_seat !== undefined && token) ? r.seats[r.you_seat] : null;
    // Update the tab title on EVERY poll, even when the DOM below is kept
    // unchanged - otherwise a player who joins can stay at the default title.
    if (mySeat) setTitle(mySeat.name);
    showPreview(r.board);
    // Re-render only when the lobby actually changed; otherwise leave the DOM
    // (and any text the player is typing) untouched.
    if (body.dataset.built === '1' && key === lastKey) return;

    // preserve the name being typed across a re-render
    const oldInput = document.getElementById('name-input');
    const prevName = oldInput ? oldInput.value : '';
    const wasFocused = oldInput && document.activeElement === oldInput;

    let html = '';

    html += `<div class="muted">参加者 ${r.seats.length} / 4（2人以上で開始できます）</div>`;

    // house rules (chosen before the game starts)
    const st = r.settings || {};
    const desertOpts = [
      ['center',   'センター',   '砂漠は常に中央'],
      ['coast_ng', '内陸',       '砂漠は海岸以外（内陸）'],
      ['none',     '固定なし',   '砂漠はどこでも（海岸もあり）'],
    ];
    const victoryOpts = [
      [10, '10点（通常）', '通常のカタン（10点で勝利）'],
      [7,  '7点（短縮）', '短時間で終わる7点勝利ルール'],
    ];
    const numberOpts = [
      ['official', '公式準拠', 'ルールブック通りの螺旋配置'],
      ['random',   'ランダム',   '6-8隣接・2-12隣接を避けてランダム'],
    ];
    html += `<div class="rules"><div class="rules-title">ハウスルール</div>
      <div class="rules-row"><span class="rules-label">砂漠</span><span class="rules-choices">`;
    const fixed = r.rules_fixed || {};
    const hasDesert = Object.prototype.hasOwnProperty.call(st, 'desert');
    for (const [val, label, title] of desertOpts) {
      const checked = hasDesert ? st.desert === val : false;
      const fixedNow = fixed.desert && checked;
      html += `<label class="radio${fixedNow ? ' fixed' : ''}" title="${title}">
        <input type="radio" name="rule-desert" value="${val}" ${checked ? 'checked' : ''} ${fixed.desert ? 'disabled' : ''}>
        ${label}</label>`;
    }
    html += `</span></div>
      <div class="rules-row"><span class="rules-label">勝利点</span><span class="rules-choices">`;
    const hasVictory = Object.prototype.hasOwnProperty.call(st, 'victory');
    for (const [val, label, title] of victoryOpts) {
      const checked = hasVictory ? Number(st.victory) === val : false;
      const fixedNow = fixed.victory && checked;
      html += `<label class="radio${fixedNow ? ' fixed' : ''}" title="${title}">
        <input type="radio" name="rule-victory" value="${val}" ${checked ? 'checked' : ''} ${fixed.victory ? 'disabled' : ''}>
        ${label}</label>`;
    }
    html += `</span></div>
      <div class="rules-row"><span class="rules-label">数字チップ</span><span class="rules-choices">`;
    const hasNumbers = Object.prototype.hasOwnProperty.call(st, 'numbers');
    for (const [val, label, title] of numberOpts) {
      const checked = hasNumbers ? st.numbers === val : false;
      const fixedNow = fixed.numbers && checked;
      html += `<label class="radio${fixedNow ? ' fixed' : ''}" title="${title}">
        <input type="radio" name="rule-numbers" value="${val}" ${checked ? 'checked' : ''} ${fixed.numbers ? 'disabled' : ''}>
        ${label}</label>`;
    }
    html += `</span></div>
    </div>`;

    // seat list
    for (const s of r.seats) {
      const me = mySeat && s.seat === mySeat.seat;
      const col = colorOf(s);
      html += `<div class="row${me ? ' me' : ''}"><span class="seat">${s.seat + 1}</span>
        <span class="name"><span class="cs" style="background:${COLOR_HEX[col]}"></span>${esc(s.name)}${me ? ' <span class="muted">(あなた)</span>' : ''}</span>
        <span class="roll">${s.roll ? s.roll[0] + '+' + s.roll[1] + ' = ' + s.total : '未振り'}</span></div>`;
    }

    // pick order (by dice) - and, once everyone rolled, the turn-slot draft
    const rolled = r.seats.filter(s => s.roll).sort((a, b) => b.total - a.total);
    if (rolled.length) {
      html += `<div class="order">${r.draft ? '選択順（ダイスの大きい順）' : '順番（暫定・ダイスの大きい順）'}: ` +
        rolled.map(s => esc(s.name) + '(' + s.total + ')').join(' → ') + `</div>`;
    }

    if (r.draft) {
      const d = r.draft;
      const cp = d.colors || {};
      const qname = seat => esc((d.queue.find(x => x.seat === seat) || {}).name || '');
      const myTurn = !!mySeat && d.current_picker === mySeat.seat;
      const iHaveSlot = !!mySeat && d.slots[String(mySeat.seat)] !== undefined;
      const iHaveColor = !!mySeat && cp[String(mySeat.seat)] !== undefined;

      html += `<div style="margin-top:8px;font-size:13px;font-weight:bold;">
        盤面を見ながら、順番とコマの色を選んでください（ダイスの大きい順に、1人ずつ）</div>`;
      // turn numbers
      const taken = {};
      for (const k of Object.keys(d.slots)) taken[d.slots[k]] = Number(k);
      html += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">';
      for (let n = 1; n <= d.queue.length; n++) {
        const ownerSeat = (taken[n] !== undefined) ? taken[n] : null;
        const owner = ownerSeat !== null ? (d.queue.find(x => x.seat === ownerSeat) || {}).name : null;
        const mine = ownerSeat !== null && mySeat && ownerSeat === mySeat.seat;
        // the current picker may take any free number; a player who already
        // picked may still switch to another free number before starting
        const canClick = ownerSeat === null && !!mySeat && (myTurn || iHaveSlot);
        html += `<button class="slot${owner ? ' taken' : ''}${mine ? ' mine' : ''}"
          data-slot="${n}" ${canClick ? '' : 'disabled'}>
          <b>${n}番目</b><br><span>${owner ? esc(owner) : '空き'}</span></button>`;
      }
      html += '</div>';

      // colours - chosen by the same player right after their turn number
      html += `<div style="margin-top:10px;font-size:13px;font-weight:bold;">
        コマの色</div>`;
      const ownerOf = {};
      for (const k of Object.keys(cp)) ownerOf[cp[k]] = Number(k);
      html += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">';
      for (const c of COLOR_ORDER) {
        const ownerSeat = (ownerOf[c] !== undefined) ? ownerOf[c] : null;
        const mine = ownerSeat !== null && !!mySeat && ownerSeat === mySeat.seat;
        const canClick = ownerSeat === null && !!mySeat &&
          ((myTurn && iHaveSlot) || iHaveColor);
        html += `<button class="color-btn${mine ? ' on' : ''}" data-color="${c}" ${canClick ? '' : 'disabled'}>
          <span class="cs" style="background:${COLOR_HEX[c]}"></span>${COLOR_JA[c]}` +
          (ownerSeat !== null ? `：${qname(ownerSeat)}` : '') + `</button>`;
      }
      html += '</div>';
      if (mySeat) {
        if ((d.stage || 'draft') === 'done') {
          html += `<div class="order">全員が番号と色を選びました。ゲーム開始できます。</div>`;
        } else if (myTurn) {
          html += `<div class="order" style="color:#ffd54f;">▶ あなたの番です。` +
            (iHaveSlot ? 'コマの色を選んでください' : '番号を選んでください') + `</div>`;
        } else {
          html += `<div class="order">待機中…（${qname(d.current_picker)} の番）</div>`;
        }
      }
    }

    html += '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">';
    if (!mySeat) {
      html += `<input type="text" id="name-input" placeholder="名前" maxlength="24">
        <button class="btn" id="btn-join">入室</button>`;
    } else {
      html += `<button class="btn" id="btn-roll-room" ${mySeat.roll ? 'disabled' : ''}>サイコロを振る</button>
        <button class="btn" id="btn-start" ${r.can_start ? '' : 'disabled'}>ゲーム開始</button>
        <button class="btn" id="btn-leave">退出する</button>`;
    }
    html += '</div>';
    body.innerHTML = html;
    body.dataset.built = '1';
    lastKey = key;

    // house rule radios
    body.querySelectorAll('input[name="rule-desert"]').forEach(inp => {
      inp.onchange = async () => {
        const res = await act('room_setting', { key: 'desert', value: inp.value });
        if (!res.ok) { alert(res.error || '設定を変更できませんでした'); }
        lastKey = null;
        renderLobby();
      };
    });
    body.querySelectorAll('input[name="rule-victory"]').forEach(inp => {
      inp.onchange = async () => {
        const res = await act('room_setting', { key: 'victory', value: parseInt(inp.value, 10) });
        if (!res.ok) { alert(res.error || '設定を変更できませんでした'); }
        lastKey = null;
        renderLobby();
      };
    });
    body.querySelectorAll('input[name="rule-numbers"]').forEach(inp => {
      inp.onchange = async () => {
        const res = await act('room_setting', { key: 'numbers', value: inp.value });
        if (!res.ok) { alert(res.error || '設定を変更できませんでした'); }
        lastKey = null;
        renderLobby();
      };
    });

    if (!mySeat) {
      const inp = document.getElementById('name-input');
      if (inp) { inp.value = prevName; if (wasFocused) inp.focus(); }
      document.getElementById('btn-join').onclick = async () => {
        const name = (document.getElementById('name-input').value || '').trim() || null;
        const res = await act('join', { name });
        if (res.ok) {
          token = res.token; setToken(token); lastKey = null;
          try { sessionStorage.removeItem('catan_stale_warned'); } catch (e) {}
          renderLobby();
        } else alert(res.error || '入室できませんでした');
      };
    } else {
      document.getElementById('btn-roll-room').onclick = async () => {
        const res = await act('room_roll');
        if (!res.ok) alert(res.error || '振れませんでした');
        lastKey = null;
        renderLobby();
      };
      document.getElementById('btn-start').onclick = async () => {
        const res = await act('room_start');
        if (!res.ok) { alert(res.error || '開始できませんでした'); lastKey = null; renderLobby(); return; }
        renderLobby();
      };
      document.getElementById('btn-leave').onclick = async () => {
        if (!confirm('この席から退出しますか？（もう一度入るには入室し直してください）')) return;
        const res = await act('leave');
        if (!res.ok) { alert(res.error || '退出できませんでした'); return; }
        // Leave the seat on the server first, then forget the token locally so
        // the next load shows the (empty) name field.
        setToken(null); token = null; forgetSeat(); location.reload();
      };
    }
    // piece colours
    body.querySelectorAll('button[data-color]').forEach(b => {
      b.onclick = async () => {
        const res = await act('room_color', { color: b.dataset.color });
        if (!res.ok) alert(res.error || '色を変更できませんでした');
        lastKey = null;
        renderLobby();
      };
    });
    // turn-slot draft
    if (mySeat && r.draft) {
      body.querySelectorAll('button[data-slot]').forEach(b => {
        b.onclick = async () => {
          const res = await act('room_pick', { slot: parseInt(b.dataset.slot, 10) });
          if (!res.ok) alert(res.error || '選べませんでした');
          lastKey = null;
          renderLobby();
        };
      });
    }
  }

  function showGame(r) {
    // Keep the tab title personalised even when the page reloads straight into
    // a running game (the lobby render is skipped in that case).
    const seat = (r && r.you_seat !== null && r.you_seat !== undefined && r.seats) ? r.seats[r.you_seat] : null;
    if (seat) setTitle(seat.name);
    document.body.classList.remove('preview');
    document.getElementById('lobby').style.display = 'none';
    document.getElementById('layout').style.display = 'flex';
    if (!booted) {
      booted = true;
      CatanGame.boot({ mode: 'client', token });
    }
  }

  async function tick() {
    if (booted) return;   // game already running; game.js polls /state
    try { await renderLobby(); }
    catch (e) {
      // Never fail silently: a thrown render used to leave the page on the
      // board preview with no message at all ("just the hexes").
      showFatal(e);
    }
    try { diagLine(); } catch (e) {}
  }
  tick();
  setInterval(tick, 1500);
})();
</script>
</body>
</html>
